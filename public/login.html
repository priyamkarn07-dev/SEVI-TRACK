<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in — SEVI TRACK</title>
<meta name="theme-color" content="#060a1c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth-wrap">
  <div class="card auth-card">
    <div style="text-align:center;margin-bottom:22px"><img src="/assets/logo-mark.svg" alt="" width="56" height="56" style="margin:0 auto 12px;border-radius:16px"><h2 style="margin:0 0 4px">Welcome to SEVI TRACK</h2><p class="muted small" style="margin:0">Sign in or create an advertiser account</p></div>
    <div class="tabs" role="tablist"><button type="button" role="tab" id="tab-login" class="active">Sign in</button><button type="button" role="tab" id="tab-register">Create account</button></div>

    <form id="login-form" novalidate>
      <div class="form-alert" role="alert"></div>
      <div class="field" data-field="email"><label for="l-email">Email address</label><input class="input" id="l-email" name="email" type="email" autocomplete="email" inputmode="email" required><div class="err"></div></div>
      <div class="field" data-field="password"><label for="l-pass">Password</label><div class="pw-wrap"><input class="input" id="l-pass" name="password" type="password" autocomplete="current-password" required><button type="button">Show</button></div><div class="err"></div></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
    </form>

    <form id="register-form" class="hidden" novalidate>
      <div class="form-alert" role="alert"></div>
      <div class="field" data-field="name"><label for="r-name">Full name</label><input class="input" id="r-name" name="name" type="text" autocomplete="name" maxlength="100" required><div class="err"></div></div>
      <div class="field" data-field="email"><label for="r-email">Email address</label><input class="input" id="r-email" name="email" type="email" autocomplete="email" inputmode="email" required><div class="err"></div></div>
      <div class="field" data-field="whatsapp"><label for="r-wa">WhatsApp number<span class="opt">(optional)</span></label><input class="input" id="r-wa" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="+1 555 123 4567"><div class="err"></div></div>
      <div class="field" data-field="password"><label for="r-pass">Password</label><div class="pw-wrap"><input class="input" id="r-pass" name="password" type="password" autocomplete="new-password" required><button type="button">Show</button></div><div class="hint"><span>At least 8 characters, with letters and numbers</span></div><div class="err"></div></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
    </form>
    <p class="small dim" style="text-align:center;margin:20px 0 0">Administrator? <a href="/admin-login.html">Sign in to the admin portal</a></p>
  </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>

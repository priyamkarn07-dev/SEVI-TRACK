<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin sign in — SEVI TRACK</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#060a1c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="site-header"></div>
<main class="auth-wrap">
  <div class="card auth-card">
    <div style="text-align:center;margin-bottom:24px"><img src="/assets/logo-mark.svg" alt="" width="56" height="56" style="margin:0 auto 12px;border-radius:16px"><h2 style="margin:0 0 4px">Admin Portal</h2><p class="muted small" style="margin:0">Restricted to SEVI TRACK administrators</p></div>
    <form id="admin-form" novalidate>
      <div class="form-alert" role="alert"></div>
      <div class="field" data-field="email"><label for="a-email">Admin email</label><input class="input" id="a-email" name="email" type="email" autocomplete="username" inputmode="email" required><div class="err"></div></div>
      <div class="field" data-field="password"><label for="a-pass">Password</label><div class="pw-wrap"><input class="input" id="a-pass" name="password" type="password" autocomplete="current-password" required><button type="button">Show</button></div><div class="err"></div></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in to dashboard</button>
    </form>
    <p class="small dim" style="text-align:center;margin:20px 0 0"><a href="/login.html">&larr; Advertiser sign in</a></p>
  </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/admin-login.js"></script>
</body>
</html>
